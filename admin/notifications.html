<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notifications | 4 FIRE UNITED</title>

<link rel="stylesheet" href="CSS/dashboard.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

.push-notification-section {

    margin: 30px;

    padding: 25px;

    background: #111;

    border: 1px solid rgba(255,123,0,.25);

    border-radius: 16px;

}

.push-notification-section h2 {

    margin: 0 0 20px;

    color: #fff;

}

.push-notification-form {

    display: grid;

    gap: 16px;

    max-width: 700px;

}

.push-notification-form label {

    color: #fff;

    font-weight: 600;

}

.push-notification-form input,
.push-notification-form textarea,
.push-notification-form select {

    width: 100%;

    box-sizing: border-box;

    padding: 13px;

    margin-top: 7px;

    border-radius: 8px;

    border: 1px solid #333;

    background: #181818;

    color: #fff;

    font-family: Poppins, sans-serif;

    outline: none;

}

.push-notification-form input:focus,
.push-notification-form textarea:focus,
.push-notification-form select:focus {

    border-color: #ff7b00;

}

.push-notification-form textarea {

    min-height: 120px;

    resize: vertical;

}

.send-push-btn {

    padding: 13px 20px;

    border: none;

    border-radius: 8px;

    background: #ff7b00;

    color: #fff;

    font-weight: 700;

    font-size: 15px;

    cursor: pointer;

}

.send-push-btn:hover {

    background: #ff8c1a;

}

.send-push-btn:disabled {

    opacity: .6;

    cursor: not-allowed;

}

#pushStatus {

    display: none;

    padding: 12px;

    border-radius: 8px;

    font-weight: 500;

}

.push-success {

    display: block !important;

    background: rgba(0,180,80,.12);

    border: 1px solid rgba(0,180,80,.3);

    color: #55e695;

}

.push-error {

    display: block !important;

    background: rgba(255,60,60,.12);

    border: 1px solid rgba(255,60,60,.3);

    color: #ff7777;

}

</style>

</head>


<body>

<div class="main">

    <div class="topbar">

        <h1>NOTIFICATIONS</h1>

        <div class="notification-toolbar">

            <input
                type="text"
                id="notificationSearch"
                placeholder="🔍 Search notifications...">

            <select id="notificationFilter">

                <option value="all">All</option>

                <option value="unread">Unread</option>

                <option value="read">Read</option>

            </select>

            <button id="markAllRead">

                <i class="fa-solid fa-check-double"></i>

                Mark All Read

            </button>

            <button id="selectAllBtn">

                <i class="fa-solid fa-check-square"></i>

                Select All

            </button>

            <button id="deleteSelectedBtn">

                <i class="fa-solid fa-trash-can"></i>

                Delete Selected

            </button>

            <button id="clearReadBtn">

                <i class="fa-solid fa-trash"></i>

                Clear Read

            </button>

        </div>


        <a href="dashboard.html" class="dashboard-back-btn">

            <i class="fa-solid fa-arrow-left"></i>

            Dashboard

        </a>

    </div>


    <!-- =====================================
         SEND PUSH NOTIFICATION
    ====================================== -->

    <div class="push-notification-section">

        <h2>

            <i class="fa-solid fa-paper-plane"></i>

            Send Push Notification

        </h2>


        <div class="push-notification-form">
            <!-- TITLE --><!-- TITLE -->

            <div>

                <label for="pushTitle">

                    Notification Title

                </label>

                <input
                    type="text"
                    id="pushTitle"
                    maxlength="100"
                    placeholder="Enter notification title">

            </div>


            <!-- MESSAGE -->

            <div>

                <label for="pushMessage">

                    Message

                </label>

                <textarea
                    id="pushMessage"
                    maxlength="500"
                    placeholder="Enter notification message"></textarea>

            </div>


            <!-- LINK -->

            <div>

                <label for="pushLink">

                    Open Page

                </label>

                <input
                    type="text"
                    id="pushLink"
                    value="/player-dashboard.html"
                    placeholder="/player-dashboard.html">

            </div>


            <!-- BUTTON -->

            <button
                type="button"
                id="sendPushBtn"
                class="send-push-btn">

                <i class="fa-solid fa-paper-plane"></i>

                Send Notification

            </button>


            <div id="pushStatus"></div>

        </div>

    </div>


    <!-- =====================================
         EXISTING NOTIFICATIONS
    ====================================== -->

    <div id="allNotifications">

    </div>

</div>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>


<script src="js/firebase.js"></script>

<script src="js/auth-guard.js"></script>

<script src="js/notifications-page.js"></script>


<!-- =====================================
     PUSH NOTIFICATION UI
====================================== -->

<script>
const pushTitle =
    document.getElementById("pushTitle");

const pushMessage =
    document.getElementById("pushMessage");

const pushLink =
    document.getElementById("pushLink");

const sendPushBtn =
    document.getElementById("sendPushBtn");

const pushStatus =
    document.getElementById("pushStatus");

    // ============================================
    // SEND BUTTON
// ============================================

sendPushBtn.addEventListener(
    "click",
    async () => {
const title =
            pushTitle.value.trim();

        const message =
            pushMessage.value.trim();

        const link =
            pushLink.value.trim() ||
            "/player-dashboard.html";
if (!title) {

            showPushStatus(
                "Please enter a notification title.",
                false
            );

            return;

        }


        if (!message) {

            showPushStatus(
                "Please enter a notification message.",
                false
            );

            return;

        }


        try {

            sendPushBtn.disabled =
                true;


            sendPushBtn.innerHTML = `

                <i class="fa-solid fa-spinner fa-spin"></i>

                Sending...

            `;
            // Save the notification in Firestore.
await db
                .collection("notifications")
                .add({

                    title:
                        title,

                    message:
                        message,

                    link:
                        link,
                    target: "ALL",
isRead:
                        false,

                    type:
                        "push",

                    createdAt:
                        firebase.firestore
                            .FieldValue
                            .serverTimestamp(),

                    createdBy:
                        auth.currentUser?.email ||
                        "Admin"

                });


            // ========================================
            // SEND ANDROID APP FCM PUSH
            // ========================================

            const FOUR_FU_ANDROID_FCM_URL =
                "https://script.google.com/macros/s/AKfycbyazs42LLtr5ulUJDf1y2EuDRzUKrHwD_B1DzFE1q1BipaBooQMPit6T5dKJeAfMy4_/exec";

            try {

                await fetch(FOUR_FU_ANDROID_FCM_URL, {

                    method: "POST",

                    mode: "no-cors",

                    headers: {
                        "Content-Type": "text/plain;charset=utf-8"
                    },

                    body: JSON.stringify({

                        type: "admin",

                        priority: "high",

                        title: title,

                        body: message,

                        link: link,

                        targetPlayerId: "ALL",

                        senderEmail:
                            auth.currentUser?.email ||
                            "Admin"

                    })

                });

            } catch (fcmError) {

                console.warn(
                    "4FU ANDROID FCM PUSH ERROR:",
                    fcmError
                );

            }


            showPushStatus(
                "Notification sent to Android app users.",
                true
            );


            pushTitle.value = "";

            pushMessage.value = "";


        } catch (error) {

            console.error(
                "❌ Push notification error:",
                error
            );


            showPushStatus(
                error.message ||
                "Failed to create notification.",
                false
            );

        } finally {

            sendPushBtn.disabled =
                false;


            sendPushBtn.innerHTML = `

                <i class="fa-solid fa-paper-plane"></i>

                Send Notification

            `;

        }

    }
);


// ============================================
// STATUS
// ============================================

function showPushStatus(
    message,
    success
) {

    pushStatus.textContent =
        message;


    pushStatus.className =
        success
            ? "push-success"
            : "push-error";

}


// ============================================
// LOAD
// ============================================

firebase.auth().onAuthStateChanged(
    async user => {

        if (!user) {

            return;

        }


        if (
            user.email !==
            "aks303603@gmail.com"
        ) {

            return;

        }


        document.body.style.visibility =
            "visible";
}
);

</script>


</body>

</html>
