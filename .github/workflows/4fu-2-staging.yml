name: 4FU 2.0 Staging Preview

"on":
  push:
    branches:
      - 4fu-2.0-rebuild

concurrency:
  group: 4fu-2-staging
  cancel-in-progress: true

jobs:
  staging:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 4FU-2.0/package.json

      - name: Install dependencies
        working-directory: 4FU-2.0
        run: npm install

      - name: Typecheck
        working-directory: 4FU-2.0
        run: npx tsc -b

      - name: Build staging bundle
        working-directory: 4FU-2.0
        run: npx vite build --base /

      - name: Write Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT secret is missing"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Deploy Firebase preview
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          npx --yes firebase-tools hosting:channel:deploy 4fu-2-0-staging --project fire-united --config firebase.staging.json --expires 7d
