<style>

body{
    visibility:hidden;
}

/* =========================================
   GALLERY MANAGER
========================================= */

.gallery-manager{
    padding:0 5px 60px;
}

.manager-heading{
    margin-bottom:24px;
}

.manager-heading h2{
    margin:0;

    font-family:'Bebas Neue',sans-serif;

    font-size:32px;

    letter-spacing:1px;

    display:flex;
    align-items:center;

    gap:10px;
}

.manager-heading h2 i{
    font-size:28px;
}

.manager-heading p{
    margin:5px 0 0;

    font-size:13px;

    opacity:.55;
}

/* =========================================
   TOOLBAR
========================================= */

.gallery-toolbar{
    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    margin-bottom:20px;

    padding:16px;

    border:1px solid rgba(255,255,255,.08);

    border-radius:14px;

    background:rgba(255,255,255,.025);
}

.gallery-count{
    font-size:13px;

    opacity:.6;

    white-space:nowrap;
}

/* =========================================
   GALLERY GRID
========================================= */

.gallery-grid{
    display:grid;

    grid-template-columns:
        repeat(auto-fill,minmax(270px,1fr));

    gap:18px;
}

/* =========================================
   GALLERY CARD
========================================= */

.gallery-card{
    position:relative;

    overflow:hidden;

    border-radius:16px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.045),
            rgba(255,255,255,.015)
        );

    border:1px solid rgba(255,255,255,.08);

    transition:
        transform .25s ease,
        border-color .25s ease,
        box-shadow .25s ease;
}

.gallery-card:hover{
    transform:translateY(-4px);

    border-color:rgba(255,115,0,.35);

    box-shadow:
        0 15px 35px rgba(0,0,0,.3);
}

/* =========================================
   IMAGE
========================================= */

.gallery-image-wrap{
    position:relative;

    width:100%;

    aspect-ratio:16/10;

    overflow:hidden;

    background:#0b0b0b;
}

.gallery-image-wrap::after{
    content:"";

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            to top,
            rgba(0,0,0,.3),
            transparent 45%
        );

    pointer-events:none;
}

.gallery-image{
    width:100%;

    height:100%;

    display:block;

    object-fit:cover;

    transition:
        transform .45s ease;
}

.gallery-card:hover .gallery-image{
    transform:scale(1.05);
}

/* =========================================
   GALLERY INFO
========================================= */

.gallery-info{
    padding:15px;
}

.gallery-info h3{
    margin:0 0 13px;

    font-size:14px;

    font-weight:600;

    line-height:1.4;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

/* =========================================
   BUTTONS
========================================= */

.gallery-buttons{
    display:flex;

    gap:9px;

    padding-top:13px;

    border-top:1px solid rgba(255,255,255,.07);
}

.edit-btn,
.delete-btn{

    flex:1;

    min-height:38px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:7px;

    border-radius:9px;

    font-family:Poppins,sans-serif;

    font-size:11px;

    font-weight:600;

    text-decoration:none;

    cursor:pointer;

    transition:.25s;
}

.edit-btn{
    color:#fff;

    background:rgba(255,255,255,.06);

    border:1px solid rgba(255,255,255,.09);
}

.edit-btn:hover{
    background:rgba(255,255,255,.11);

    transform:translateY(-2px);
}

.delete-btn{
    color:#fff;

    background:rgba(255,59,48,.1);

    border:1px solid rgba(255,59,48,.22);
}

.delete-btn:hover{
    background:#e53935;

    border-color:#e53935;

    transform:translateY(-2px);
}

/* =========================================
   EMPTY
========================================= */

.empty-state{
    grid-column:1/-1;

    text-align:center;

    padding:70px 20px;

    border-radius:16px;

    border:1px dashed rgba(255,255,255,.1);

    background:rgba(255,255,255,.02);
}

.empty-state i{
    display:block;

    margin-bottom:14px;

    font-size:38px;

    opacity:.3;
}

.empty-state h3{
    margin:0 0 6px;

    font-size:18px;
}

.empty-state p{
    margin:0;

    font-size:12px;

    opacity:.5;
}

/* =========================================
   MOBILE
========================================= */

@media(max-width:700px){

    .gallery-manager{
        padding:0 0 40px;
    }

    .manager-heading h2{
        font-size:28px;
    }

    .gallery-grid{
        grid-template-columns:1fr;
    }

}

</style>

</head>
