<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Clip | 4 FIRE UNITED</title>


    <!-- =====================================================
         GOOGLE FONT
    ====================================================== -->

    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         FONT AWESOME
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- =====================================================
         EXISTING DASHBOARD CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="CSS/dashboard.css"
    >


    <!-- =====================================================
         PREMIUM EDIT CLIP DESIGN
    ====================================================== -->

    <style>

        * {
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            margin: 0;

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(255, 91, 0, 0.16),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 90% 90%,
                    rgba(255, 115, 0, 0.10),
                    transparent 30%
                ),
                #070707;

            color: #ffffff;

            font-family: "Poppins", sans-serif;

            overflow-x: hidden;

        }


        body::before {

            content: "";

            position: fixed;

            inset: 0;

            pointer-events: none;

            background-image:
                linear-gradient(
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px
                );

            background-size: 45px 45px;

            mask-image:
                linear-gradient(
                    to bottom,
                    black,
                    transparent
                );

            z-index: 0;

        }


        .main {

            position: relative;

            z-index: 1;

            width: 100%;

            max-width: 1100px;

            margin: 0 auto;

            padding: 28px 22px 70px;

        }


        /* =====================================================
           TOPBAR
        ====================================================== */

        .topbar {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

            margin-bottom: 28px;

            padding: 20px 22px;

            border: 1px solid
                rgba(255, 255, 255, 0.08);

            border-radius: 20px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.055),
                    rgba(255,255,255,0.018)
                );

            backdrop-filter: blur(18px);

            box-shadow:
                0 20px 60px
                rgba(0, 0, 0, 0.40);

        }


        .topbar h1 {

            margin: 0;

            font-family: "Bebas Neue", sans-serif;

            font-size: clamp(30px, 5vw, 46px);

            letter-spacing: 2px;

            line-height: 1;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #ff7b00
                );

            -webkit-background-clip: text;

            background-clip: text;

            color: transparent;

        }


        .back-btn {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            min-height: 44px;

            padding: 0 18px;

            border-radius: 12px;

            color: #ffffff;

            text-decoration: none;

            font-size: 13px;

            font-weight: 700;

            border: 1px solid
                rgba(255, 123, 0, 0.30);

            background:
                rgba(255, 123, 0, 0.08);

            transition:
                0.25s ease;

        }


        .back-btn:hover {

            color: #ffffff;

            border-color: #ff7b00;

            background:
                rgba(255, 123, 0, 0.18);

            transform: translateX(-3px);

        }


        /* =====================================================
           EDIT BOX
        ====================================================== */

        .edit-box {

            position: relative;

            padding: clamp(22px, 4vw, 38px);

            border-radius: 28px;

            border: 1px solid
                rgba(255, 255, 255, 0.09);

            background:
                linear-gradient(
                    145deg,
                    rgba(24,24,24,0.96),
                    rgba(10,10,10,0.94)
                );

            box-shadow:
                0 30px 90px
                rgba(0,0,0,0.55);

            overflow: hidden;

        }


        .edit-box::before {

            content: "";

            position: absolute;

            top: -120px;

            right: -100px;

            width: 280px;

            height: 280px;

            border-radius: 50%;

            background:
                rgba(255, 103, 0, 0.11);

            filter: blur(55px);

            pointer-events: none;

        }


        .edit-box::after {

            content: "4FU";

            position: absolute;

            right: 24px;

            bottom: -25px;

            font-family: "Bebas Neue", sans-serif;

            font-size: 110px;

            letter-spacing: 5px;

            color:
                rgba(255,255,255,0.018);

            pointer-events: none;

        }


        /* =====================================================
           INPUTS
        ====================================================== */

        .edit-box input[type="text"],
        .edit-box input[type="url"],
        .edit-box textarea,
        .edit-box select {

            width: 100%;

            min-height: 54px;

            margin-bottom: 17px;

            padding: 0 16px;

            border-radius: 14px;

            border: 1px solid
                rgba(255,255,255,0.09);

            outline: none;

            background:
                rgba(255,255,255,0.045);

            color: #ffffff;

            font-family: "Poppins", sans-serif;

            font-size: 14px;

            transition:
                border-color 0.25s ease,
                background 0.25s ease,
                box-shadow 0.25s ease;

        }


        .edit-box textarea {

            min-height: 145px;

            padding: 15px 16px;

            resize: vertical;

        }


        .edit-box input::placeholder,
        .edit-box textarea::placeholder {

            color:
                rgba(255,255,255,0.38);

        }


        .edit-box input:focus,
        .edit-box textarea:focus,
        .edit-box select:focus {

            border-color:
                rgba(255,123,0,0.75);

            background:
                rgba(255,123,0,0.055);

            box-shadow:
                0 0 0 4px
                rgba(255,123,0,0.07);

        }


        .edit-box select {

            appearance: none;

            cursor: pointer;

            background-image:
                linear-gradient(45deg, transparent 50%, #ff7b00 50%),
                linear-gradient(135deg, #ff7b00 50%, transparent 50%);

            background-position:
                calc(100% - 20px) 23px,
                calc(100% - 14px) 23px;

            background-size:
                6px 6px,
                6px 6px;

            background-repeat: no-repeat;

        }


        .edit-box select option {

            background: #111111;

            color: #ffffff;

        }


        /* =====================================================
           LABELS
        ====================================================== */

        .edit-box > label {

            display: block;

            margin: 7px 0 9px;

            color:
                rgba(255,255,255,0.72);

            font-size: 12px;

            font-weight: 700;

            text-transform: uppercase;

            letter-spacing: 1px;

        }


        /* =====================================================
           FILE INPUT
        ====================================================== */

        #thumbnail,
        #videoFile {

            width: 100%;

            min-height: 52px;

            margin-bottom: 17px;

            padding: 7px;

            border-radius: 14px;

            border: 1px dashed
                rgba(255,123,0,0.38);

            background:
                rgba(255,123,0,0.035);

            color: rgba(255,255,255,0.70);

            cursor: pointer;

        }


        #thumbnail:hover,
        #videoFile:hover {

            border-color:
                rgba(255,123,0,0.80);

            background:
                rgba(255,123,0,0.07);

        }


        #thumbnail::file-selector-button,
        #videoFile::file-selector-button {

            border: 0;

            border-radius: 10px;

            padding: 10px 14px;

            margin-right: 12px;

            background:
                linear-gradient(
                    135deg,
                    #ff7b00,
                    #ff4d00
                );

            color: #ffffff;

            font-family: "Poppins", sans-serif;

            font-weight: 700;

            cursor: pointer;

        }


        /* =====================================================
           FEATURED
        ====================================================== */

        .featured-option {

            display: flex;

            align-items: center;

            margin: 8px 0 22px;

            padding: 16px 18px;

            border-radius: 15px;

            border: 1px solid
                rgba(255,123,0,0.17);

            background:
                rgba(255,123,0,0.045);

        }


        .featured-option label {

            display: flex;

            align-items: center;

            gap: 11px;

            margin: 0;

            cursor: pointer;

            color:
                rgba(255,255,255,0.82);

            font-size: 13px;

            font-weight: 600;

        }


        #featured {

            appearance: none;

            width: 21px;

            height: 21px;

            margin: 0;

            border-radius: 6px;

            border: 1px solid
                rgba(255,123,0,0.55);

            background:
                rgba(255,255,255,0.04);

            cursor: pointer;

            position: relative;

        }


        #featured:checked {

            background:
                linear-gradient(
                    135deg,
                    #ff9a00,
                    #ff4d00
                );

            border-color:
                #ff7b00;

        }


        #featured:checked::after {

            content: "✓";

            position: absolute;

            inset: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            color: #ffffff;

            font-size: 14px;

            font-weight: 900;

        }


        /* =====================================================
           PROGRESS
        ====================================================== */

        #uploadProgress {

            appearance: none;

            width: 100% !important;

            height: 9px;

            margin: 10px 0 8px !important;

            border: 0;

            border-radius: 20px;

            overflow: hidden;

            background:
                rgba(255,255,255,0.08);

        }


        #uploadProgress::-webkit-progress-bar {

            background:
                rgba(255,255,255,0.08);

            border-radius: 20px;

        }


        #uploadProgress::-webkit-progress-value {

            background:
                linear-gradient(
                    90deg,
                    #ff4d00,
                    #ff9a00
                );

            border-radius: 20px;

        }


        #uploadProgress::-moz-progress-bar {

            background:
                linear-gradient(
                    90deg,
                    #ff4d00,
                    #ff9a00
                );

            border-radius: 20px;

        }


        #uploadStatus {

            padding: 10px 0;

            font-size: 12px;

        }


        /* =====================================================
           UPDATE BUTTON
        ====================================================== */

        .save-btn {

            position: relative;

            width: 100%;

            min-height: 58px;

            margin-top: 12px;

            border: 0;

            border-radius: 15px;

            background:
                linear-gradient(
                    135deg,
                    #ff8700,
                    #ff4d00
                );

            color: #ffffff;

            font-family: "Poppins", sans-serif;

            font-size: 14px;

            font-weight: 800;

            letter-spacing: 0.5px;

            cursor: pointer;

            box-shadow:
                0 12px 30px
                rgba(255, 82, 0, 0.24);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                opacity 0.25s ease;

            overflow: hidden;

        }


        .save-btn::before {

            content: "";

            position: absolute;

            top: 0;

            left: -100%;

            width: 70%;

            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.20),
                    transparent
                );

            transform: skewX(-20deg);

            transition:
                left 0.6s ease;

        }


        .save-btn:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 18px 40px
                rgba(255,82,0,0.32);

        }


        .save-btn:hover::before {

            left: 140%;

        }


        .save-btn:active {

            transform:
                translateY(0);

        }


        .save-btn:disabled {

            opacity: 0.55;

            cursor: not-allowed;

            transform: none;

        }


        /* =====================================================
           MOBILE
        ====================================================== */

        @media (max-width: 700px) {

            .main {

                padding:
                    15px 12px 45px;

            }


            .topbar {

                padding:
                    16px;

                border-radius:
                    17px;

                margin-bottom:
                    17px;

            }


            .topbar h1 {

                font-size:
                    32px;

            }


            .back-btn {

                min-height:
                    40px;

                padding:
                    0 13px;

                font-size:
                    12px;

            }


            .edit-box {

                padding:
                    20px 15px;

                border-radius:
                    21px;

            }


            .edit-box input[type="text"],
            .edit-box input[type="url"],
            .edit-box textarea,
            .edit-box select {

                min-height:
                    51px;

                font-size:
                    13px;

            }


            .edit-box textarea {

                min-height:
                    125px;

            }


            .save-btn {

                min-height:
                    55px;

            }

        }


        @media (max-width: 430px) {

            .topbar {

                align-items:
                    flex-start;

                flex-direction:
                    column;

            }


            .back-btn {

                width:
                    100%;

            }


            .topbar h1 {

                font-size:
                    29px;

            }


            #thumbnail,
            #videoFile {

                font-size:
                    11px;

            }

        }

    </style>

</head>


<body>


<div class="main">


    <!-- =====================================================
         TOP BAR
    ====================================================== -->

    <div class="topbar">

        <h1>
            EDIT CLIP
        </h1>


        <a
            href="clips.html"
            class="back-btn"
        >

            <i class="fa-solid fa-arrow-left"></i>

            Back to Clips

        </a>

    </div>


    <!-- =====================================================
         EDIT FORM
    ====================================================== -->

    <div class="edit-box">


        <!-- TITLE -->

        <input
            type="text"
            id="title"
            placeholder="Clip Title"
            autocomplete="off"
        >


        <!-- PLAYER -->

        <input
            type="text"
            id="playerName"
            placeholder="Player Name"
            autocomplete="off"
        >


        <!-- THUMBNAIL -->

        <label for="thumbnail">
            <i class="fa-solid fa-image"></i>
            Thumbnail
        </label>


        <input
            type="file"
            id="thumbnail"
            accept="image/jpeg,image/png,image/webp,image/*"
        >


        <!-- CLIP TYPE -->

        <label for="clipType">
            <i class="fa-solid fa-film"></i>
            Clip Type
        </label>


        <select id="clipType">

            <option value="youtube">
                YouTube
            </option>

            <option value="instagram">
                Instagram Reel
            </option>

            <option value="video">
                Upload Video
            </option>

        </select>


        <!-- VIDEO URL -->

        <input
            type="url"
            id="videoUrl"
            placeholder="YouTube / Instagram Video URL"
            autocomplete="off"
        >


        <!-- VIDEO FILE -->

        <input
            type="file"
            id="videoFile"
            accept="video/*"
            style="display:none;"
        >


        <!-- CATEGORY -->

        <input
            type="text"
            id="category"
            placeholder="Category"
            autocomplete="off"
        >


        <!-- DESCRIPTION -->

        <textarea
            id="description"
            placeholder="Clip Description"
        ></textarea>


        <!-- FEATURED -->

        <div class="featured-option">

            <label>

                <input
                    type="checkbox"
                    id="featured"
                >

                <span>
                    ⭐ Make this Featured Clip
                </span>

            </label>

        </div>


        <!-- PROGRESS -->

        <progress
            id="uploadProgress"
            value="0"
            max="100"
            style="display:none;width:100%;margin:15px 0;"
        ></progress>


        <!-- STATUS -->

        <p
            id="uploadStatus"
            style="
                display:none;
                color:#ff7b00;
                font-weight:600;
                margin-bottom:15px;
            "
        ></p>


        <!-- UPDATE -->

        <button
            id="updateClip"
            class="save-btn"
            type="button"
        >

            <i class="fa-solid fa-rotate"></i>

            Update Clip

        </button>


    </div>

</div>


<!-- =========================================================
     FIREBASE
========================================================== -->

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>

     PROJECT SCRIPTS
========================================================== -->

<script src="js/auth-guard.js"></script>

<script src="js/edit-clip.js"></script>


</body>

</html>
