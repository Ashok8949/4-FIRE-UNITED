<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Player | 4 FIRE UNITED</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Bebas+Neue&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css?v=1783829699314">

    <link rel="stylesheet" href="CSS/dashboard.css?v=1783829699314">

    <style>
        body {
            visibility: hidden;
        }
    </style>

</head>

<body>

    <div class="main">

        <div class="topbar">

            <h1>EDIT PLAYER</h1>

            <a href="players.html" class="back-btn">

                <i class="fa-solid fa-arrow-left"></i>

                Back

            </a>

        </div>

        <div class="edit-box">

            <!-- Player Image -->

            <div class="player-image-box">

                <img id="previewImage" src="../images/logo/logo.png" alt="Player">

                <label class="upload-btn">

                    <i class="fa-solid fa-image"></i>

                    Choose Player Image

                </label>

                <input type="file" id="image" accept="image/*">

            </div>

            <!-- BASIC INFORMATION -->

            <h2 class="section-title">BASIC INFORMATION</h2>

            <div class="form-grid">

                <input type="text" id="name" placeholder="Player Name">

                <input type="text" id="ign" placeholder="IGN">

                <input type="text" id="uid" placeholder="Free Fire UID">

                <input type="text" id="guild" placeholder="Guild">

                <input type="text" id="role" placeholder="Role">

                <input type="text" id="language" placeholder="Language">

                <select id="country">

                    <option value="">Select Country</option>

                    <option value="India">🇮🇳 India</option>

                    <option value="Bangladesh">🇧🇩 Bangladesh</option>

                    <option value="Nepal">🇳🇵 Nepal</option>

                    <option value="Pakistan">🇵🇰 Pakistan</option>

                    <option value="Brazil">🇧🇷 Brazil</option>

                    <option value="Indonesia">🇮🇩 Indonesia</option>

                    <option value="Thailand">🇹🇭 Thailand</option>

                    <option value="Vietnam">🇻🇳 Vietnam</option>

                    <option value="United States">🇺🇸 United States</option>

                    <option value="Russia">🇷🇺 Russia</option>

                </select>

                <input type="number" id="since" placeholder="Joined Since (e.g. 2024)">

                <input type="number" id="displayOrder" placeholder="Display Order (1,2,3...)">

                <div class="checkbox-group">

                    <label>

                        <input type="checkbox" id="featured">

                        Show on Home Page

                    </label>

                    <div class="form-group">
                        <label for="loginEmail">Player Login Email</label>
                        <input type="email" id="loginEmail" placeholder="player@example.com">
                    </div>

                </div>

            </div>

            <!-- GAME INFORMATION -->

            <h2 class="section-title">GAME INFORMATION</h2>

            <div class="form-grid">

                <input type="number" id="level" placeholder="Level">

                <select id="rank">

                    <option value="">Select Rank</option>

                    <option value="Bronze">Bronze</option>

                    <option value="Silver I">Silver I</option>
                    <option value="Silver II">Silver II</option>
                    <option value="Silver III">Silver III</option>

                    <option value="Gold I">Gold I</option>
                    <option value="Gold II">Gold II</option>
                    <option value="Gold III">Gold III</option>
                    <option value="Gold IV">Gold IV</option>

                    <option value="Platinum I">Platinum I</option>
                    <option value="Platinum II">Platinum II</option>
                    <option value="Platinum III">Platinum III</option>
                    <option value="Platinum IV">Platinum IV</option>

                    <option value="Diamond I">Diamond I</option>
                    <option value="Diamond II">Diamond II</option>
                    <option value="Diamond III">Diamond III</option>
                    <option value="Diamond IV">Diamond IV</option>
                    <option value="Diamond V">Diamond V</option>

                    <option value="Heroic">Heroic</option>

                    <option value="Elite Heroic">Elite Heroic</option>

                    <option value="Master">Master</option>

                    <option value="Grandmaster">Grandmaster</option>

                </select>

                <input type="text" id="kd" placeholder="KD">

                <input type="text" id="headshot" placeholder="Headshot %">

                <input type="number" id="matches" placeholder="Matches">

                <input type="number" id="booyah" placeholder="Booyah">

                <input type="text" id="weaponName" placeholder="Favorite Weapon">

                <input type="text" id="weaponType" placeholder="Weapon Type (Shotgun, AR, SMG...)">

                <input type="text" id="weaponQuote" placeholder="Weapon Quote">

                <label class="upload-btn">

                    <i class="fa-solid fa-gun"></i>

                    Choose Weapon Image

                </label>

                <input type="file" id="weaponImage" accept="image/*">

            </div>

            <!-- SOCIAL MEDIA -->

            <h2 class="section-title">SOCIAL MEDIA</h2>

            <div class="form-grid">

                <input type="url" id="instagram" placeholder="Instagram Profile Link">

                <input type="url" id="youtube" placeholder="YouTube Channel Link">

                <input type="url" id="discord" placeholder="Discord Profile / Invite Link">

                <input type="url" id="facebook" placeholder="Facebook Profile Link">

            </div>

            <progress id="uploadProgress" value="0" max="100" style="
        width:100%;
        display:none;
        margin:18px 0;
    ">
            </progress>

            <p id="uploadStatus" style="
        display:none;
        color:#ff8a00;
        font-weight:600;
        margin-bottom:15px;
    ">
            </p>

            <button class="save-btn" id="saveBtn">

                <i class="fa-solid fa-floppy-disk"></i>

                Save Player

            </button>

        </div>

    </div>

    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js?v=1783829699314"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js?v=1783829699314"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js?v=1783829699314"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-storage-compat.js?v=1783829699314"></script>

    <script src="js/firebase.js?v=1783829699314"></script>
    <script src="../js/freeFireService.js?v=1783829699315"></script>
    <script src="js/auth-guard.js?v=1783829699314"></script>
    <script src="js/edit-player.js?v=1783829699315"></script>

    <!-- =========================================
         4FU LIVE FREE FIRE ADMIN EDIT SYNC
         ========================================= -->
    <script>
        (function () {
            "use strict";

            let lastFetchedUid = "";
            let fetchTimer = null;

            function pick(...values) {
                return values.find(
                    value =>
                        value !== undefined &&
                        value !== null &&
                        value !== ""
                );
            }

            function number(value) {
                if (value === undefined || value === null || value === "") {
                    return null;
                }

                const n = Number(String(value).replace(/,/g, "").trim());

                return Number.isFinite(n) ? n : null;
            }

            function rankNameFromPoints(points) {
                const rp = number(points);

                if (rp === null) return null;

                if (rp >= 10800) return "Grandmaster";
                if (rp >= 7700) return "Elite Master";
                if (rp >= 6500) return "Master";
                if (rp >= 5400) return "Elite Heroic";
                if (rp >= 3200) return "Heroic";
                if (rp >= 2600) return "Diamond V";
                if (rp >= 2100) return "Platinum IV";
                if (rp >= 1600) return "Gold IV";
                if (rp >= 1300) return "Silver III";

                return "Bronze";
            }

            function setValue(id, value) {
                const element = document.getElementById(id);

                if (!element || value === undefined || value === null || value === "") {
                    return;
                }

                element.value = value;
            }

            function regionFromCountry(country) {
                const map = {
                    India: "IND",
                    Bangladesh: "BD",
                    Nepal: "IND",
                    Pakistan: "PK",
                    Brazil: "BR",
                    Indonesia: "ID",
                    Thailand: "TH",
                    Vietnam: "VN",
                    "United States": "US",
                    Russia: "RU"
                };

                return map[country] || "IND";
            }

            function showLiveStatus(message, isError) {
                const status = document.getElementById("uploadStatus");

                if (!status) return;

                status.style.display = "block";
                status.textContent = message;
                status.style.color = isError ? "#ff4d4d" : "#22c55e";

                clearTimeout(status._liveTimer);

                status._liveTimer = setTimeout(() => {
                    status.style.display = "none";
                    status.style.color = "#ff8a00";
                }, 2500);
            }

            async function fetchAndApplyLiveData(force) {
                const uidField = document.getElementById("uid");

                if (!uidField || typeof window.getFreeFirePlayer !== "function") {
                    return;
                }

                const uid = uidField.value.trim();

                if (!uid) {
                    return;
                }

                if (!force && uid === lastFetchedUid) {
                    return;
                }

                lastFetchedUid = uid;

                try {
                    showLiveStatus("Fetching live Free Fire data...", false);

                    const countryField = document.getElementById("country");

                    const region =
                        (window.playerData && window.playerData.region) ||
                        (countryField && regionFromCountry(countryField.value)) ||
                        "IND";

                    const data = await window.getFreeFirePlayer(uid, region);

                    if (!data) {
                        showLiveStatus("Live API data unavailable. Firestore data kept.", true);
                        return;
                    }

                    const basic = data.basicInfo || data.profile || {};
                    const stats = data.stats || data.playerStats || data.statistics || {};

                    const nickname = pick(
                        basic.nickname,
                        data.nickname,
                        data.name
                    );

                    const liveGuild = pick(
                        data.guild,
                        data.clanName,
                        data.clan,
                        data.clanBasicInfo?.clanName,
                        data.clan_basic_info?.clanName,
                        data.rawProfile?.clanBasicInfo?.clanName,
                        data.rawProfile?.clan?.clanName
                    );

                    const level = pick(
                        basic.level,
                        data.level
                    );

                    const brRankingPoints = pick(
                        data.rankingPoints,
                        basic.rankingPoints,
                        basic.ranking_points,
                        stats.rankingPoints,
                        stats.ranking_points
                    );

                    const liveRank = pick(
                        basic.rankName,
                        data.rankName,
                        rankNameFromPoints(brRankingPoints),
                        typeof basic.rank === "string" ? basic.rank : null,
                        typeof data.rank === "string" ? data.rank : null
                    );

                    const matches = pick(
                        stats.matches,
                        stats.gamesPlayed,
                        stats.gamesplayed,
                        data.matches
                    );

                    const wins = pick(
                        stats.wins,
                        stats.totalWins,
                        data.wins,
                        data.booyah
                    );

                    const kills = pick(
                        stats.kills,
                        stats.totalKills,
                        data.kills
                    );

                    const deaths = pick(
                        stats.deaths,
                        stats.totalDeaths,
                        data.deaths
                    );

                    const kd = pick(
                        stats.kd,
                        stats.kdRatio,
                        data.kd,
                        (
                            number(kills) !== null &&
                            number(deaths) !== null &&
                            number(deaths) > 0
                        )
                            ? (number(kills) / number(deaths)).toFixed(2)
                            : null
                    );

                    const headshot = pick(
                        stats.headshot,
                        stats.headshotRate,
                        stats.headshotPercentage,
                        data.headshot,
                        data.headshotRate
                    );

                    /*
                     * IMPORTANT:
                     * API nickname = actual Free Fire IGN.
                     * Do not put it into "Player Name", because
                     * that field can be the team's display name.
                     */
                    setValue("ign", nickname);
                    setValue("level", level);
                    setValue("rank", liveRank);
                    setValue("guild", liveGuild);
                    setValue("language", pick(
                        data.language,
                        data.socialInfo?.language,
                        data.social?.language
                    ));
                    setValue("matches", matches);
                    setValue("booyah", wins);
                    setValue("kd", kd);
                    setValue(
                        "headshot",
                        headshot !== undefined && headshot !== null
                            ? `${headshot}${String(headshot).includes("%") ? "" : "%"}`
                            : null
                    );

                    console.info("[4FU ADMIN EDIT] Live Free Fire data applied:", {
                        uid,
                        nickname,
                        level,
                        liveRank,
                        brRankingPoints,
                        matches,
                        wins,
                        kills,
                        deaths,
                        kd,
                        headshot,
                        guild: liveGuild
                    });

                    showLiveStatus(
                        liveRank
                            ? `✓ Live data loaded — ${liveRank}${brRankingPoints ? " • " + brRankingPoints + " RP" : ""}`
                            : "✓ Live Free Fire data loaded.",
                        false
                    );

                } catch (error) {
                    console.warn(
                        "[4FU ADMIN EDIT] Live Free Fire data unavailable:",
                        error
                    );

                    showLiveStatus(
                        "Live API unavailable. Existing Firestore values kept.",
                        true
                    );
                }
            }

            function scheduleFetch(force) {
                clearTimeout(fetchTimer);

                fetchTimer = setTimeout(() => {
                    fetchAndApplyLiveData(!!force);
                }, 600);
            }

            function init() {
                const uidField = document.getElementById("uid");

                if (!uidField) return;

                uidField.addEventListener("input", () => {
                    lastFetchedUid = "";
                    scheduleFetch(false);
                });

                uidField.addEventListener("change", () => {
                    lastFetchedUid = "";
                    scheduleFetch(true);
                });

                /*
                 * edit-player.js loads the Firestore player asynchronously.
                 * This watcher waits for its UID to appear, then fetches once.
                 */
                const watcher = setInterval(() => {
                    const uid = uidField.value.trim();

                    if (uid && uid !== lastFetchedUid) {
                        fetchAndApplyLiveData(false);
                    }
                }, 700);

                setTimeout(() => {
                    clearInterval(watcher);
                }, 15000);
            }

            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", init);
            } else {
                init();
            }
        })();
    </script>

</body>

</html>
