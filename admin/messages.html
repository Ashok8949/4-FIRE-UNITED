<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Messages Manager | 4 FIRE UNITED</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" href="CSS/dashboard.css">

    <style>

        body {
            visibility: hidden;
        }

        .messages-content {
            padding: 30px;
        }

        .messages-toolbar {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .messages-heading h2 {
            margin: 0;
            font-family: "Bebas Neue", sans-serif;
            font-size: 32px;
            letter-spacing: 1px;
        }

        .messages-heading p {
            margin: 5px 0 0;
            opacity: .6;
            font-size: 13px;
        }

        .messages-count {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            padding: 7px 12px;
            border-radius: 8px;
            background: rgba(255, 102, 0, .1);
            border: 1px solid rgba(255, 102, 0, .2);
            color: #ff7200;
            font-size: 12px;
            font-weight: 600;
        }

        .messages-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 15px;
            border-radius: 10px;
            background: rgba(255, 255, 255, .04);
            border: 1px solid rgba(255, 255, 255, .08);
        }

        .search-box i {
            opacity: .55;
        }

        .search-box input {
            width: 200px;
            border: none;
            outline: none;
            background: transparent;
            color: inherit;
            font-family: Poppins, sans-serif;
        }

        .search-box input::placeholder {
            opacity: .5;
        }

        .message-actions-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            border: 1px solid rgba(255,255,255,.08);
            cursor: pointer;
            font-family: Poppins, sans-serif;
        }

        .delete-selected {
            color: #ff5a5a;
        }

        .messages-table-box {
            overflow-x: auto;
        }

        .messages-table-box table {
            min-width: 850px;
        }

        .messages-table-box th:first-child,
        .messages-table-box td:first-child {
            width: 45px;
            text-align: center;
        }

        .messages-table-box input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #ff7200;
            cursor: pointer;
        }

        .message-name {
            font-weight: 600;
        }

        .message-email {
            opacity: .7;
            font-size: 12px;
        }

        .message-subject {
            max-width: 230px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .message-status {
            display: inline-flex;
            padding: 6px 10px;
            border-radius: 7px;
            background: rgba(255,255,255,.06);
            border: 1px solid rgba(255,255,255,.08);
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .empty-message {
            padding: 70px 20px;
            text-align: center;
            opacity: .55;
        }

        .empty-message i {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .empty-message h3 {
            margin: 0 0 5px;
        }

        .empty-message p {
            margin: 0;
            font-size: 13px;
        }

        @media (max-width: 900px) {

            .messages-content {
                padding: 20px;
            }

            .messages-actions {
                width: 100%;
            }

            .search-box {
                flex: 1;
            }

            .search-box input {
                width: 100%;
            }

        }

    </style>

</head>

<body>

<div class="admin-layout">


    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="sidebar-logo">
            <img src="../images/logo/logo.png" alt="4 Fire United">
        </div>

        <nav class="sidebar-nav">

            <a href="dashboard.html">
                <i class="fa-solid fa-chart-line"></i>
                <span>Dashboard</span>
            </a>

            <a href="players.html">
                <i class="fa-solid fa-users"></i>
                <span>Players</span>
            </a>

            <a href="tournaments.html">
                <i class="fa-solid fa-trophy"></i>
                <span>Tournaments</span>
            </a>

            <a href="gallery.html">
                <i class="fa-solid fa-images"></i>
                <span>Gallery</span>
            </a>

            <a href="clips.html">
                <i class="fa-solid fa-video"></i>
                <span>Clips</span>
            </a>

            <a href="announcements.html">
                <i class="fa-solid fa-bullhorn"></i>
                <span>Announcements</span>
            </a>

            <a href="messages.html" class="active">
                <i class="fa-solid fa-envelope"></i>
                <span>Messages</span>
            </a>

            <a href="applications.html">
                <i class="fa-solid fa-file-signature"></i>
                <span>Applications</span>
            </a>

            <a href="challenge-registrations.html">
                <i class="fa-solid fa-gamepad"></i>
                <span>Challenges</span>
            </a>

            <a href="settings.html">
                <i class="fa-solid fa-gear"></i>
                <span>Settings</span>
            </a>

        </nav>

    </aside>


    <!-- MAIN -->

    <main class="main">


        <!-- TOPBAR -->

        <div class="topbar">

            <div>

                <h1>CONTACT MESSAGES</h1>

                <span>4 FIRE UNITED • ADMIN PANEL</span>

            </div>


            <div class="top-actions">

                <div class="admin-info">

                    <i class="fa-solid fa-user-shield"></i>

                    <span>Administrator</span>

                </div>


                <button class="logout-btn" onclick="logout()">

                    <i class="fa-solid fa-right-from-bracket"></i>

                    Logout

                </button>

            </div>

        </div>


        <!-- CONTENT -->

        <div class="messages-content">


            <div class="messages-toolbar">


                <div class="messages-heading">

                    <h2>INBOX</h2>

                    <p>
                        Manage contact messages received from the 4 FIRE UNITED website.
                    </p>


                    <div class="messages-count">

                        <i class="fa-solid fa-envelope"></i>

                        <span id="messageCount">
                            0 Messages
                        </span>

                    </div>

                </div>


                <div class="messages-actions">


                    <div class="search-box">

                        <i class="fa-solid fa-magnifying-glass"></i>

                        <input
                            type="text"
                            id="searchMessage"
                            placeholder="Search messages..."
                        >

                    </div>


                    <button
                        id="selectAllBtn"
                        class="back-btn message-actions-btn">

                        <i class="fa-solid fa-check-double"></i>

                        Select All

                    </button>


                    <button
                        id="deleteSelectedBtn"
                        class="back-btn message-actions-btn delete-selected">

                        <i class="fa-solid fa-trash"></i>

                        Delete Selected

                    </button>

                </div>

            </div>


            <div class="table-box messages-table-box">

                <table>

                    <thead>

                        <tr>

                            <th>

                                <input
                                    type="checkbox"
                                    id="masterCheck"
                                    title="Select all visible messages"
                                >

                            </th>

                            <th>Name</th>

                            <th>Email</th>

                            <th>Subject</th>

                            <th>Date</th>

                            <th>Status</th>

                            <th>Action</th>

                        </tr>

                    </thead>


                    <tbody id="messageTable">

                    </tbody>

                </table>

            </div>

        </div>

    </main>

</div>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>


<script src="js/firebase.js"></script>

<script src="js/auth-guard.js"></script>

<script src="js/message-manager.js?v=20260907-2"></script>

</body>

</html>
