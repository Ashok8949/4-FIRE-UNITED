name: Firestore Rules Tests

on:
  pull_request:
    paths:
      - "firestore.rules"
      - "firebase.json"
      - "security-tests/**"
      - "functions/**"
      - ".github/workflows/firestore-rules-tests.yml"
  push:
    branches:
      - feature/festive-universe
    paths:
      - "firestore.rules"
      - "firebase.json"
      - "security-tests/**"
      - "functions/**"
      - ".github/workflows/firestore-rules-tests.yml"

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java for the Firestore Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install security test dependencies
        run: npm install --prefix security-tests

      - name: Check JavaScript syntax
        run: |
          node --check js/main.js
          node --check js/festive-universe.js
          node --check admin/js/india-datetime.js
          node --check admin/js/settings.js
          node --check admin/js/auth-guard.js
          node --check admin/js/experience-studio.js
          node --check functions/index.js
          node --check functions/security-guards.js
          node --check functions/visitor-counter.js
          node --check functions/public-rate-limit.js
          node --check functions/public-submissions.js

      - name: Run Firestore Emulator rules tests
        run: npx --yes firebase-tools emulators:exec --project demo-4fu-firestore-rules --only firestore "npm test --prefix security-tests"
