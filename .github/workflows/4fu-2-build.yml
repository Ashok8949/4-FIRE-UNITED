name: 4FU 2.0 Build
on:
  push:
    branches: [4fu-2.0-rebuild]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 4FU-2.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 4FU-2.0/package.json
      - run: npm install
      - run: npm run build
      - run: npm run qa
