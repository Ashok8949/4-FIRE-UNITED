<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4 FIRE UNITED | PLAYER</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>
/* =========================
   4 FIRE UNITED PLAYER LOGIN
   ADMIN STYLE — VISUAL ONLY
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    overflow:hidden;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:'Poppins',sans-serif;

    background:#050505;

    position:relative;
}

/* BACKGROUND — SAME ADMIN STYLE */

body::before{
    content:"";
    position:absolute;
    inset:0;

    background:
    radial-gradient(circle at top,#ff5a00 0%,transparent 40%),
    radial-gradient(circle at bottom,#ff2200 0%,transparent 40%),
    #050505;

    filter:blur(60px);
    opacity:.55;

    animation:bgMove 10s linear infinite alternate;
}

@keyframes bgMove{
    0%{transform:scale(1);}
    100%{transform:scale(1.15);}
}

/* FIRE BALLS — SAME ADMIN STYLE */

.fire{
    position:absolute;

    width:260px;
    height:260px;

    background:radial-gradient(circle,#ff9d00,#ff4d00,#ff2200,transparent);

    filter:blur(60px);
    border-radius:50%;
    opacity:.45;

    animation:floatFire 9s ease-in-out infinite;
}

.fire2{
    top:8%;
    left:8%;
    animation-delay:2s;
}

.fire3{
    bottom:5%;
    right:8%;
    animation-delay:4s;
}

@keyframes floatFire{
    0%{transform:translateY(0);}
    50%{transform:translateY(-50px);}
    100%{transform:translateY(0);}
}

/* PARTICLES — SAME ADMIN STYLE */

.particles{
    position:absolute;
    inset:0;
    pointer-events:none;
    overflow:hidden;
}

.particles span{
    position:absolute;
    display:block;

    width:8px;
    height:8px;

    background:#ff7700;
    border-radius:50%;

    box-shadow:
    0 0 12px #ff7700,
    0 0 25px #ff5500;

    animation:particleUp 8s linear infinite;
    opacity:.7;
}

.particles span:nth-child(1){left:8%;animation-delay:0s;}
.particles span:nth-child(2){left:20%;animation-delay:1s;}
.particles span:nth-child(3){left:34%;animation-delay:2s;}
.particles span:nth-child(4){left:48%;animation-delay:3s;}
.particles span:nth-child(5){left:62%;animation-delay:4s;}
.particles span:nth-child(6){left:76%;animation-delay:5s;}
.particles span:nth-child(7){left:88%;animation-delay:6s;}
.particles span:nth-child(8){left:95%;animation-delay:7s;}

@keyframes particleUp{
    0%{
        transform:translateY(110vh) scale(.4);
        opacity:0;
    }
    15%{opacity:1;}
    100%{
        transform:translateY(-20vh) scale(1.4);
        opacity:0;
    }
}

/* LOGIN CARD — SAME ADMIN STYLE */

.login-container{
    position:relative;
    z-index:10;

    width:420px;

    padding:45px;

    border-radius:28px;

    background:rgba(20,20,20,.45);

    backdrop-filter:blur(22px);

    border:1px solid rgba(255,255,255,.08);

    box-shadow:
    0 0 25px rgba(255,90,0,.35),
    0 0 80px rgba(255,80,0,.15);
}

/* LOGO — SAME ADMIN STYLE */

.logo-box{
    text-align:center;
    margin-bottom:35px;
}

.logo-box img{
    width:95px;

    filter:
    drop-shadow(0 0 12px #ff5500)
    drop-shadow(0 0 25px #ff7700);

    animation:logoFloat 3s ease-in-out infinite;
}

@keyframes logoFloat{
    0%{transform:translateY(0);}
    50%{transform:translateY(-8px);}
    100%{transform:translateY(0);}
}

.logo-box h1{
    font-family:'Bebas Neue',sans-serif;

    font-size:52px;
    letter-spacing:3px;

    color:#fff;

    margin-top:18px;
}

.logo-box p{
    color:#ff8c2b;
    letter-spacing:2px;
    font-size:14px;
}

/* LOGIN TITLE — SAME ADMIN STYLE */

.login-box h2{
    text-align:center;

    font-size:34px;

    color:#fff;

    margin-bottom:25px;
}

/* INPUTS — SAME ADMIN STYLE */

.input-box{
    position:relative;
    margin-bottom:20px;
}

.input-box input{
    width:100%;

    padding:16px 50px;

    border:none;
    outline:none;

    border-radius:12px;

    background:rgba(255,255,255,.06);

    color:#fff;

    font-size:16px;

    border:1px solid rgba(255,255,255,.08);

    transition:.35s;
}

.input-box input:focus{
    border-color:#ff6600;

    box-shadow:
    0 0 15px rgba(255,100,0,.45);
}

.input-box i:first-child{
    position:absolute;

    left:18px;
    top:50%;

    transform:translateY(-50%);

    color:#ff7b00;
}

#togglePassword{
    position:absolute;

    right:18px;
    top:50%;

    transform:translateY(-50%);

    cursor:pointer;

    color:#ff7b00;
}

/* OPTIONS — SAME ADMIN STYLE */

.opts{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:22px;

    font-size:14px;
}

.options label{
    color:#ddd;
}

.options a{
    color:#ff8a00;
    text-decoration:none;
}

/* BUTTON — SAME ADMIN STYLE */

#loginBtn{
    width:100%;

    padding:15px;

    border:none;

    border-radius:12px;

    background:linear-gradient(45deg,#ff3300,#ff8800);

    font-size:17px;
    font-weight:700;

    color:#fff;

    cursor:pointer;

    transition:.35s;
}

#loginBtn:hover{
    transform:translateY(-3px);

    box-shadow:
    0 0 20px #ff5500,
    0 0 40px rgba(255,120,0,.45);
}

/* ERROR */

#error{
    margin-top:18px;
    text-align:center;
    font-weight:600;
    min-height:22px;
}

/* FOOTER — SAME ADMIN STYLE */

.login-footer{
    position:fixed;
    left:0;
    right:0;
    bottom:28px;

    text-align:center;

    color:#999;

    font-size:13px;

    letter-spacing:1px;

    z-index:10;
}

/* MOBILE — SAME ADMIN STYLE */

@media(max-width:768px){

    body{
        overflow:auto;
        padding:30px 0 70px;
    }

    .login-container{
        width:92%;
        padding:30px 22px;
    }

    .logo-box h1{
        font-size:42px;
    }

    .logo-box img{
        width:75px;
    }

    .login-box h2{
        font-size:28px;
    }

    .input-box input{
        padding:14px 45px;
        font-size:15px;
    }

    #loginBtn{
        padding:14px;
        font-size:16px;
    }

    .opts{
        flex-direction:row;
        gap:12px;
        font-size:13px;
    }
}

/* OPTIONAL ADMIN MOUSE GLOW — SAME EFFECT */

.mouse-glow{
    position:fixed;

    width:220px;
    height:220px;

    border-radius:50%;

    background:radial-gradient(
        circle,
        rgba(255,120,0,.35),
        transparent 70%
    );

    pointer-events:none;

    transform:translate(-50%,-50%);

    filter:blur(30px);

    z-index:1;

    transition:.05s;
}
</style>

</head>
<body>

<div class="bg-blur"></div>

<div class="fire"></div>
<div class="fire fire2"></div>
<div class="fire fire3"></div>

<div class="particles">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
</div>

<div class="login-container">

    <div class="logo-box">

        <img src="images/logo/logo.png" alt="4 FIRE UNITED">

        <h1>4 FIRE UNITED</h1>

        <p>PLAYER CONTROL PANEL</p>

    </div>

    <div class="login-box">

        <h2>LOGIN</h2>

        <div class="input-box">

            <i class="fa-solid fa-user"></i>

            <input
                type="email"
                id="email"
                placeholder="Email"
                autocomplete="email">

        </div>

        <div class="input-box">

            <i class="fa-solid fa-lock"></i>

            <input
                type="password"
                id="password"
                placeholder="Password"
                autocomplete="current-password">

            <i
                class="fa-solid fa-eye"
                id="togglePassword">
            </i>

        </div>

        <div class="options">

            <label>
                <input type="checkbox" id="remember">
                Remember Me
            </label>

            <a href="#" id="forgotPassword">
                Forgot Password?
            </a>

        </div>

        <button id="loginBtn">
            LOGIN
        </button>

        <p id="error"></p>

    </div>

</div>

<div class="login-footer">
    <p>Only Authorized 4 FIRE UNITED Players</p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>

    <script src="js/firebase.js"></script>

    <script>

        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const loginBtn = document.getElementById("loginBtn");
        const errorBox = document.getElementById("error");
        const togglePassword = document.getElementById("togglePassword");
        const forgotPassword = document.getElementById("forgotPassword");

        // Keep player logged in even after closing/reopening the website or Android app.
        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)
            .catch(error => console.error("Auth persistence setup failed:", error));

        // If Firebase already has a logged-in player, skip the login screen.
        auth.onAuthStateChanged(async (user) => {
            if (!user) return;

            try {
                let playerSnapshot =
                    await db.collection("players")
                        .where("authUid", "==", user.uid)
                        .limit(1)
                        .get();

                if (playerSnapshot.empty) {
                    playerSnapshot =
                        await db.collection("players")
                            .where("loginEmail", "==", user.email)
                            .limit(1)
                            .get();
                }

                if (playerSnapshot.empty) {
                    await auth.signOut();
                    return;
                }

                const playerDoc = playerSnapshot.docs[0];

                localStorage.setItem("4fuPlayerId", playerDoc.id);
                localStorage.setItem("4fuPlayerUid", user.uid);

                if (!window.location.pathname.endsWith("player-dashboard.html")) {
                    window.location.href = "player-dashboard.html";
                }
            } catch (error) {
                console.error("Auto login failed:", error);
            }
        });

        togglePassword.addEventListener("click", () => {

            if (passwordInput.type === "password") {

                passwordInput.type = "text";

                togglePassword.classList.remove("fa-eye");
                togglePassword.classList.add("fa-eye-slash");

            } else {

                passwordInput.type = "password";

                togglePassword.classList.remove("fa-eye-slash");
                togglePassword.classList.add("fa-eye");

            }

        });

        loginBtn.addEventListener("click", async () => {

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            errorBox.textContent = "";

            if (!email || !password) {

                errorBox.textContent = "Please enter email and password.";

                return;

            }

            loginBtn.disabled = true;
            loginBtn.innerHTML =
                '<i class="fa-solid fa-spinner fa-spin"></i> LOGIN...';

            try {

                const result =
                    await auth.signInWithEmailAndPassword(
                        email,
                        password
                    );

                const user = result.user;

                let playerSnapshot =
                    await db.collection("players")
                        .where("authUid", "==", user.uid)
                        .limit(1)
                        .get();

                if (playerSnapshot.empty) {
                    playerSnapshot =
                        await db.collection("players")
                            .where("loginEmail", "==", user.email)
                            .limit(1)
                            .get();
                }

                if (playerSnapshot.empty) {

                    await auth.signOut();

                    throw new Error(
                        "PLAYER_ACCOUNT_NOT_LINKED"
                    );

                }

                const playerDoc =
                    playerSnapshot.docs[0];

                localStorage.setItem(
                    "4fuPlayerId",
                    playerDoc.id
                );

                localStorage.setItem(
                    "4fuPlayerUid",
                    user.uid
                );

                window.location.href =
                    "player-dashboard.html";

            } catch (error) {

                console.error(error);

                if (error.message === "PLAYER_ACCOUNT_NOT_LINKED") {

                    errorBox.textContent =
                        "Your account is not linked with a 4FU player.";

                } else {

                    switch (error.code) {

                        case "auth/invalid-credential":
                        case "auth/wrong-password":
                        case "auth/user-not-found":

                            errorBox.textContent =
                                "Invalid email or password.";

                            break;

                        case "auth/too-many-requests":

                            errorBox.textContent =
                                "Too many attempts. Try again later.";

                            break;

                        default:

                            errorBox.textContent =
                                "Login failed. Please try again.";

                    }

                }

                loginBtn.disabled = false;

                loginBtn.innerHTML =
                    '<i class="fa-solid fa-right-to-bracket"></i> &nbsp; LOGIN';

            }

        });

        forgotPassword.addEventListener("click", async (event) => {

            event.preventDefault();

            const email = emailInput.value.trim();

            if (!email) {

                errorBox.textContent =
                    "Enter your email first.";

                return;

            }

            try {

                await auth.sendPasswordResetEmail(email);

                errorBox.style.color = "#55ff99";

                errorBox.textContent =
                    "Password reset email sent.";

            } catch (error) {

                errorBox.style.color = "#ff5555";

                errorBox.textContent =
                    "Unable to send reset email.";

            }

        });

    </script>

</body>
</html>
