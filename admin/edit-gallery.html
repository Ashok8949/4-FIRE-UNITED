<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Gallery | 4 FIRE UNITED</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css?v=1783829699314">

<link rel="stylesheet" href="CSS/dashboard.css?v=1783829699314">

<style>

body{
    visibility:hidden;
}

/* =========================================================
   PREMIUM EDIT GALLERY
   ========================================================= */

.gallery-edit-box{
    margin-top:22px;
    padding:22px;
    border:1px solid rgba(255,114,0,.16);
    border-radius:18px;
    background:rgba(255,255,255,.018);
}

.gallery-file-label{
    min-height:165px;
    margin-top:18px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:9px;
    padding:22px;
    border:1.5px dashed rgba(255,114,0,.42);
    border-radius:16px;
    background:rgba(0,0,0,.22);
    color:#fff;
    text-align:center;
    cursor:pointer;
    transition:.3s ease;
}

.gallery-file-label:hover{
    border-color:#ff7200;
    background:rgba(255,114,0,.045);
    transform:translateY(-2px);
}

.gallery-file-label i{
    color:#ff7200;
    font-size:38px;
}

.gallery-file-label strong{
    font-size:14px;
}

.gallery-file-label span{
    color:#888;
    font-size:11px;
}

#image{
    display:none;
}

.gallery-preview{
    display:block;
    margin-top:18px;
    width:100%;
    max-width:600px;
    max-height:380px;
    overflow:hidden;
    border-radius:14px;
    border:1px solid rgba(255,114,0,.22);
    background:#050505;
}

.gallery-preview img{
    display:block;
    width:100%;
    max-height:380px;
    object-fit:contain;
}

.gallery-file-name{
    margin-top:10px;
    color:#aaa;
    font-size:11px;
    word-break:break-all;
}

.gallery-status{
    min-height:22px;
    margin-top:14px;
    color:#ff8a2a;
    font-size:12px;
}

.gallery-actions{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.gallery-actions .save-btn{
    flex:1;
}

.cancel-gallery-btn{
    display:none;
    min-width:130px;
    padding:13px 18px;
    border:1px solid rgba(255,255,255,.14);
    border-radius:10px;
    background:rgba(255,255,255,.045);
    color:#aaa;
    font-family:Poppins,sans-serif;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    transition:.3s ease;
}

.cancel-gallery-btn:hover{
    color:#fff;
    border-color:rgba(255,114,0,.45);
    background:rgba(255,114,0,.08);
}

.cancel-gallery-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

@media(max-width:600px){

    .gallery-actions{
        flex-direction:column;
    }

    .cancel-gallery-btn{
        width:100%;
    }

}

</style>

</head>

<body>

<div class="main">

    <div class="topbar">

        <h1>EDIT GALLERY IMAGE</h1>

        <a href="gallery.html" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i>
            Back
        </a>

    </div>


    <div class="edit-box gallery-edit-box">

        <input
            type="text"
            id="title"
            placeholder="Image Title">


        <label for="image" class="gallery-file-label">

            <i class="fa-solid fa-image"></i>

            <strong>Change Gallery Image</strong>

            <span>
                Click here to select a new image from your device
            </span>

            <span>
                JPG, JPEG, PNG, WEBP
            </span>

        </label>


        <input
            type="file"
            id="image"
            accept="image/jpeg,image/png,image/webp">


        <div class="gallery-preview">

            <img
                id="preview"
                src=""
                alt="Gallery image preview">

        </div>


        <div
            id="galleryFileName"
            class="gallery-file-name">
        </div>


        <div
            id="galleryStatus"
            class="gallery-status">
        </div>


        <div class="gallery-actions">

            <button
                id="updateGallery"
                class="save-btn"
                type="button">

                <i class="fa-solid fa-floppy-disk"></i>

                Update Image

            </button>


            <button
                id="cancelGallery"
                class="cancel-gallery-btn"
                type="button">

                <i class="fa-solid fa-xmark"></i>

                Cancel

            </button>

        </div>

    </div>

</div>


<!-- =========================================================
     FIREBASE
     ========================================================= -->

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js?v=1783829699314"></script>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js?v=1783829699314"></script>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js?v=1783829699314"></script>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-storage-compat.js?v=1783829699314"></script>

<script src="js/firebase.js?v=1783829699314"></script>

<script src="js/auth-guard.js?v=1783829699314"></script>


<script>

/* =========================================================
   EDIT GALLERY
   Cloudinary is used for NEW image uploads.
   Firebase Storage is NOT used for new uploads.
   ========================================================= */

const params =
    new URLSearchParams(window.location.search);

const galleryId =
    params.get("id");


const titleInput =
    document.getElementById("title");

const imageInput =
    document.getElementById("image");

const preview =
    document.getElementById("preview");

const fileNameBox =
    document.getElementById("galleryFileName");

const statusBox =
    document.getElementById("galleryStatus");

const updateButton =
    document.getElementById("updateGallery");

const cancelButton =
    document.getElementById("cancelGallery");


let selectedImageFile = null;

let currentImageUrl = "";


/* =========================================================
   CLOUDINARY CONFIG
   Same Cloudinary account/preset used by Add Gallery.
   ========================================================= */

const CLOUDINARY_CLOUD_NAME =
    "vuto9fey";

const CLOUDINARY_UPLOAD_PRESET =
    "4fu_clips";


/* =========================================================
   IMAGE URL FIX
   ========================================================= */

function getImageUrl(image){

    if(!image){
        return "";
    }

    image =
        String(image).trim();


    /* Full URL / Data URL */

    if(
        image.startsWith("http://") ||
        image.startsWith("https://") ||
        image.startsWith("data:")
    ){

        return image;

    }


    /* Root-relative */

    if(image.startsWith("/")){

        return image;

    }


    /* Old project-relative image path */

    return "../" + image;

}


/* =========================================================
   SHOW CANCEL
   ========================================================= */

function showCancel(){

    cancelButton.style.display =
        "block";

}


/* =========================================================
   HIDE CANCEL
   ========================================================= */

function hideCancel(){

    cancelButton.style.display =
        "none";

}


/* =========================================================
   LOAD GALLERY DATA
   ========================================================= */

async function loadGallery(){

    if(!galleryId){

        statusBox.textContent =
            "❌ Gallery image ID missing.";

        return;

    }


    try{

        const doc =
            await firebase
                .firestore()
                .collection("gallery")
                .doc(galleryId)
                .get();


        if(!doc.exists){

            statusBox.textContent =
                "❌ Gallery image not found.";

            return;

        }


        const data =
            doc.data() || {};


        titleInput.value =
            data.title || "";


        currentImageUrl =
            data.image || "";


        preview.src =
            getImageUrl(currentImageUrl);


    }

    catch(error){

        console.error(
            "Gallery Load Error:",
            error
        );


        statusBox.textContent =
            "❌ Unable to load gallery image: " +
            (
                error.message ||
                "Unknown error"
            );

    }

}


/* =========================================================
   IMAGE SELECT
   ========================================================= */

imageInput.addEventListener(
    "change",
    function(){

        const file =
            this.files && this.files[0];


        selectedImageFile =
            file || null;


        if(!file){

            fileNameBox.textContent =
                "";

            hideCancel();

            return;

        }


        if(!file.type.startsWith("image/")){

            this.value =
                "";

            selectedImageFile =
                null;

            fileNameBox.textContent =
                "";

            statusBox.textContent =
                "❌ Please select a valid image.";

            hideCancel();

            return;

        }


        const size =
            (
                file.size /
                1024 /
                1024
            ).toFixed(2);


        fileNameBox.textContent =
            "New image: " +
            file.name +
            " (" +
            size +
            " MB)";


        statusBox.textContent =
            "";


        showCancel();


        const reader =
            new FileReader();


        reader.onload =
            function(event){

                preview.src =
                    event.target.result;

            };


        reader.onerror =
            function(){

                statusBox.textContent =
                    "❌ Unable to preview image.";

            };


        reader.readAsDataURL(file);

    }
);


/* =========================================================
   CLOUDINARY IMAGE UPLOAD
   ========================================================= */

function uploadImageToCloudinary(file){

    return new Promise(
        (resolve,reject)=>{

            if(!file){

                reject(
                    "No image selected."
                );

                return;

            }


            const formData =
                new FormData();


            formData.append(
                "file",
                file
            );


            formData.append(
                "upload_preset",
                CLOUDINARY_UPLOAD_PRESET
            );


            const xhr =
                new XMLHttpRequest();


            const uploadUrl =
                "https://api.cloudinary.com/v1_1/" +
                CLOUDINARY_CLOUD_NAME +
                "/image/upload";


            xhr.open(
                "POST",
                uploadUrl,
                true
            );


            xhr.timeout =
                180000;


            xhr.upload.onprogress =
                function(event){

                    if(event.lengthComputable){

                        const percent =
                            Math.round(
                                (
                                    event.loaded /
                                    event.total
                                ) * 100
                            );


                        statusBox.textContent =
                            "Uploading new image... " +
                            percent +
                            "%";

                    }

                };


            xhr.onload =
                function(){

                    console.log(
                        "Cloudinary Upload Status:",
                        xhr.status
                    );


                    console.log(
                        "Cloudinary Response:",
                        xhr.responseText
                    );


                    if(
                        xhr.status >= 200 &&
                        xhr.status < 300
                    ){

                        try{

                            const result =
                                JSON.parse(
                                    xhr.responseText
                                );


                            if(
                                result.secure_url
                            ){

                                resolve(result);

                            }
                            else{

                                reject(
                                    "Cloudinary did not return an image URL."
                                );

                            }

                        }
                        catch(error){

                            reject(
                                "Invalid Cloudinary response."
                            );

                        }

                    }
                    else{

                        let message =
                            "Cloudinary upload failed.";


                        try{

                            const result =
                                JSON.parse(
                                    xhr.responseText
                                );


                            if(
                                result.error &&
                                result.error.message
                            ){

                                message =
                                    result.error.message;

                            }

                        }
                        catch(error){

                            console.error(
                                "Cloudinary response parse error:",
                                error
                            );

                        }


                        reject(message);

                    }

                };


            xhr.onerror =
                function(){

                    reject(
                        "Network error while uploading image."
                    );

                };


            xhr.ontimeout =
                function(){

                    reject(
                        "Image upload timed out. Please check your internet connection."
                    );

                };


            xhr.onabort =
                function(){

                    reject(
                        "Image upload was cancelled."
                    );

                };


            xhr.send(formData);

        }
    );

}


/* =========================================================
   UPDATE GALLERY
   ========================================================= */

updateButton.addEventListener(
    "click",
    async function(){

        const updatedTitle =
            titleInput.value.trim();


        if(!galleryId){

            statusBox.textContent =
                "❌ Gallery image ID missing.";

            return;

        }


        if(!updatedTitle){

            statusBox.textContent =
                "❌ Please enter image title.";

            titleInput.focus();

            return;

        }


        const user =
            firebase.auth().currentUser;


        if(!user){

            statusBox.textContent =
                "❌ Admin login required.";

            return;

        }


        updateButton.disabled =
            true;

        cancelButton.disabled =
            true;


        updateButton.innerHTML =
            '<i class="fa-solid fa-spinner fa-spin"></i> Updating...';


        try{

            let updatedImage =
                currentImageUrl;


            let cloudinaryPublicId =
                "";


            /* =================================================
               NEW IMAGE SELECTED
               Upload to Cloudinary instead of Firebase Storage.
               ================================================= */

            if(selectedImageFile){

                statusBox.textContent =
                    "Uploading new image... 0%";


                const uploadResult =
                    await uploadImageToCloudinary(
                        selectedImageFile
                    );


                if(
                    !uploadResult ||
                    !uploadResult.secure_url
                ){

                    throw new Error(
                        "New image upload failed."
                    );

                }


                updatedImage =
                    uploadResult.secure_url;


                cloudinaryPublicId =
                    uploadResult.public_id ||
                    "";


                statusBox.textContent =
                    "New image uploaded. Saving changes...";

            }
            else{

                statusBox.textContent =
                    "Saving changes...";

            }


            /* =================================================
               FIRESTORE UPDATE
               ================================================= */

            const updateData = {

                title:
                    updatedTitle,

                image:
                    updatedImage,

                updatedAt:
                    firebase.firestore
                        .FieldValue
                        .serverTimestamp()

            };


            if(cloudinaryPublicId){

                updateData.cloudinaryPublicId =
                    cloudinaryPublicId;

            }


            await firebase
                .firestore()
                .collection("gallery")
                .doc(galleryId)
                .update(updateData);


            /* =================================================
               ANDROID APP FCM NOTIFICATION
               ================================================= */

            try{

                fetch(
                    "https://script.google.com/macros/s/AKfycbyazs42LLTr5ulUJDf1y2EuDRzUKrHwD_B1DzFE1q1BipaBooQMPit6T5dKJeAfMy4_/exec",
                    {
                        method:"POST",

                        mode:"no-cors",

                        headers:{
                            "Content-Type":
                                "text/plain;charset=utf-8"
                        },

                        body:JSON.stringify({

                            type:
                                "gallery",

                            priority:
                                "normal",

                            title:
                                "🖼️ Gallery Updated",

                            body:
                                "Gallery image updated: " +
                                updatedTitle,

                            link:
                                "/gallery.html",

                            updateType:
                                "gallery",

                            targetPlayerId:
                                "ALL",

                            senderEmail:
                                firebase.auth()
                                    .currentUser?.email ||
                                "Admin"

                        })

                    }
                )
                .catch(
                    error => {

                        console.warn(
                            "4FU ANDROID FCM GALLERY UPDATE ERROR:",
                            error
                        );

                    }
                );

            }
            catch(error){

                console.warn(
                    "4FU ANDROID FCM GALLERY UPDATE ERROR:",
                    error
                );

            }


            /* =================================================
               SUCCESS
               ================================================= */

            statusBox.textContent =
                "🔥 Gallery updated successfully!";


            selectedImageFile =
                null;


            imageInput.value =
                "";


            fileNameBox.textContent =
                "";


            hideCancel();


            updateButton.innerHTML =
                '<i class="fa-solid fa-check"></i> Updated Successfully';


            setTimeout(
                () => {

                    window.location.href =
                        "gallery.html";

                },
                1000
            );

        }


        catch(error){

            console.error(
                "Gallery Update Error:",
                error
            );


            statusBox.textContent =
                "❌ Update failed: " +
                (
                    error.message ||
                    error
                );


            updateButton.disabled =
                false;

            cancelButton.disabled =
                false;


            updateButton.innerHTML =
                '<i class="fa-solid fa-floppy-disk"></i> Update Image';

        }

    }
);


/* =========================================================
   CANCEL NEW IMAGE SELECTION
   ========================================================= */

cancelButton.addEventListener(
    "click",
    function(){

        imageInput.value =
            "";

        selectedImageFile =
            null;


        fileNameBox.textContent =
            "";


        statusBox.textContent =
            "";


        /* Restore original image */

        preview.src =
            getImageUrl(
                currentImageUrl
            );


        hideCancel();


        updateButton.disabled =
            false;

        cancelButton.disabled =
            false;


        updateButton.innerHTML =
            '<i class="fa-solid fa-floppy-disk"></i> Update Image';

    }
);


/* =========================================================
   START
   ========================================================= */

loadGallery();

</script>

</body>
</html>
