name: 4FU 2.0 Staging Preview

on:
  push:
    branches:
      - 4fu-2.0-rebuild

concurrency:
  group: 4fu-2-staging
  cancel-in-progress: true

jobs:
  staging:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 4FU-2.0/package-lock.json

      - name: Install dependencies
        working-directory: 4FU-2.0
        run: npm ci

      - name: Typecheck and build staging bundle
        working-directory: 4FU-2.0
        run: npx tsc -b && npx vite build --base /

      - name: Configure Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Deploy isolated Firebase Hosting preview
        run: |
          npx --yes firebase-tools hosting:channel:deploy 4fu-2-0-staging             --project fire-united             --config firebase.staging.json             --expires 7d
