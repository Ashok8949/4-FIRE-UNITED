<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Profile | 4 FIRE UNITED</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Bebas+Neue&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #050505;
            color: #fff;
            font-family: Poppins, Arial, sans-serif;
            padding: 30px;
        }

        .main {
            max-width: 1100px;
            margin: auto;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .topbar h1 {
            font-size: 30px;
            font-weight: 700;
        }

        .back-btn {
            text-decoration: none;
            color: #fff;
            border: 1px solid #ff6200;
            padding: 10px 18px;
            border-radius: 8px;
            transition: .3s;
        }

        .back-btn:hover {
            background: #ff6200;
        }

        .edit-box {
            background: #111;
            border: 1px solid #222;
            border-radius: 18px;
            padding: 30px;
        }

        .player-image-box {
            text-align: center;
            margin-bottom: 35px;
        }

        #previewImage {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #ff6200;
            display: block;
            margin: 0 auto 18px;
        }

        .upload-btn {
            display: inline-block;
            padding: 11px 18px;
            border: 1px solid #ff6200;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            background: #181818;
        }

        .upload-btn:hover {
            background: #ff6200;
        }

        input[type="file"] {
            display: none;
        }

        .section-title {
            color: #ff7200;
            font-size: 20px;
            margin: 30px 0 18px;
            border-bottom: 1px solid #222;
            padding-bottom: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .form-grid input,
        .form-grid select {
            width: 100%;
            padding: 13px 14px;
            background: #181818;
            border: 1px solid #292929;
            border-radius: 8px;
            color: #fff;
            outline: none;
            font-family: inherit;
        }

        .form-grid input:focus,
        .form-grid select:focus {
            border-color: #ff7200;
        }

        select option {
            background: #181818;
            color: #fff;
        }

        .weapon-image-box {
            margin-top: 15px;
        }

        .weapon-preview {
            display: none;
            width: 150px;
            height: 100px;
            object-fit: contain;
            background: #181818;
            border: 1px solid #292929;
            border-radius: 10px;
            margin-bottom: 12px;
        }

        .save-btn {
            width: 100%;
            margin-top: 30px;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #ff7200;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .save-btn:hover {
            background: #ff6200;
        }

        .save-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        #uploadProgress {
            width: 100%;
            margin-top: 20px;
        }

        #uploadStatus {
            color: #ff8a00;
            font-weight: 600;
            margin-top: 12px;
            display: none;
        }

        @media(max-width:700px) {

            body {
                padding: 15px;
            }

            .topbar {
                gap: 15px;
                align-items: flex-start;
            }

            .topbar h1 {
                font-size: 24px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .edit-box {
                padding: 20px;
            }

        }
    </style>

</head>

<body>

    <div class="main">

        <div class="topbar">

            <a href="player-dashboard.html" class="back-btn">
                <i class="fa-solid fa-arrow-left"></i>
                Back
            </a>



        </div>


        <div class="edit-box">


        <!-- ========================= -->
        <!-- PLAYER IMAGE -->
        <!-- ========================= -->

        <div class="player-image-box">

            <img id="previewImage" src="images/logo/logo.png" alt="Player">

            <label class="upload-btn" for="image">

                <i class="fa-solid fa-camera"></i>

                Change Profile Photo

            </label>

            <input type="file" id="image" accept="image/*">

        </div>


        <!-- ========================= -->
        <!-- BASIC INFORMATION -->
        <!-- ========================= -->

        <h2 class="section-title">

        <div class="form-grid">

            <input type="text" id="ign" placeholder="IGN">

            

            <input type="text" id="uid" placeholder="Free Fire UID">

            <input type="text" id="guild" placeholder="Guild">

        <!-- ========================= -->
        <!-- GAME INFORMATION -->
        <!-- ========================= -->

        <h2 class="section-title">

        </h2>

        <div class="form-grid">

            <input type="number" id="level" placeholder="Level">

            <select id="rank">

                <option value="">Select Rank</option>

                <option value="Bronze">Bronze</option>

                <option value="Gold II">Gold II</option>
                <option value="Gold III">Gold III</option>
                <option value="Gold IV">Gold IV</option>

                <option value="Platinum I">Platinum I</option>
                <option value="Platinum II">Platinum II</option>
                <option value="Platinum III">Platinum III</option>
                <option value="Platinum IV">Platinum IV</option>

                <option value="Diamond I">Diamond I</option>
                <option value="Diamond II">Diamond II</option>
                <option value="Diamond III">Diamond III</option>
                <option value="Diamond IV">Diamond IV</option>
                <option value="Diamond V">Diamond V</option>

        <!-- ========================= -->
        <!-- WEAPON INFORMATION -->

        <h2 class="section-title">
            WEAPON INFORMATION
        </h2>

        <div class="form-grid">

            <input type="text" id="weaponName" placeholder="Favorite Weapon">

            <input type="text" id="weaponType" placeholder="Weapon Type (Shotgun, AR, SMG...)">

            <input type="text" id="weaponQuote" placeholder="Weapon Quote">

        </div>

        <div class="weapon-image-box">

            <img id="weaponPreview" class="weapon-preview" src="" alt="Weapon">

            <label class="upload-btn" for="weaponImage">

                Choose Weapon Image

            </label>

            <input type="file" id="weaponImage" accept="image/*">

        </div>


        <!-- ========================= -->
        <!-- SOCIAL MEDIA -->
        <!-- ========================= -->

        <h2 class="section-title">
            SOCIAL MEDIA
        </h2>

        <div class="form-grid">

            <input type="url" id="instagram" placeholder="Instagram Profile Link">

            <input type="url" id="youtube" placeholder="YouTube Channel Link">

            <input type="url" id="discord" placeholder="Discord Profile / Invite Link">

            <input type="url" id="facebook" placeholder="Facebook Profile Link">

            

        </div>

       <h2 class="section-title">
    ACCOUNT SECURITY
</h2>

<div class="form-grid">

    <!-- Current / Old Email -->
   <input
    type="email"
    id="currentEmail"
    placeholder="Current Email"
    autocomplete="email"
    readonly
>

<input
    type="email"
    id="loginEmail"

    autocomplete="email"

        <!-- ========================= -->

        </progress>

        <p id="uploadStatus"></p>


        <!-- ========================= -->

    </div>


    <!-- ========================= -->
    <!-- FIREBASE -->
    <!-- ========================= -->

    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-storage-compat.js"></script>


    <script src="js/firebase.js"></script>

    <script>
// ==========================================
// 4 FIRE UNITED - PLAYER EDIT PROFILE
// ==========================================

let playerDocId = null;
let playerData = null;


// ==========================================
// AUTH CHECK + LOAD PLAYER
// ==========================================

auth.onAuthStateChanged(async (user) => {

    if (!user) {

        window.location.href = "player-login.html";

        return;

    }

    try {

        const snapshot = await db
            .collection("players")
            .where("loginEmail", "==", user.email)
            .limit(1)
            .get();


        if (snapshot.empty) {

            await auth.signOut();

            window.location.href = "player-login.html";

            return;

        }


        const doc = snapshot.docs[0];

        playerDocId = doc.id;

        playerData = doc.data();


        // ==========================================
        // LOAD PLAYER DATA
        // ==========================================

        document.getElementById("name").value =
            playerData.name || "";

        document.getElementById("ign").value =
            playerData.ign || "";

        document.getElementById("uid").value =
            playerData.uid || "";

        document.getElementById("guild").value =
            playerData.guild || "";

        document.getElementById("role").value =
            playerData.role || "";

        // ROLE IS CONTROLLED BY ADMIN ONLY
        const roleField = document.getElementById("role");
        if (roleField) {
            roleField.readOnly = true;
            roleField.disabled = true;
            roleField.setAttribute("aria-readonly", "true");
            roleField.title = "Role can only be changed by an administrator.";
        }

        document.getElementById("language").value =
            playerData.language || "";

        document.getElementById("country").value =
            playerData.country || "";

        document.getElementById("currentEmail").value =
            playerData.loginEmail || user.email || "";

        // New email is optional. Leave blank unless the player
        // actually wants to change the Firebase login email.
        document.getElementById("loginEmail").value = "";

        document.getElementById("level").value =
            playerData.level ?? "";

        document.getElementById("rank").value =
            playerData.rank || "";

        document.getElementById("kd").value =
            playerData.kd || "";

        document.getElementById("headshot").value =
            playerData.headshot || "";

        document.getElementById("matches").value =
            playerData.matches ?? "";

        document.getElementById("booyah").value =
            playerData.booyah ?? "";


        // ==========================================
        // WEAPON
        // ==========================================

        document.getElementById("weaponName").value =
            playerData.weaponName || "";

        document.getElementById("weaponType").value =
            playerData.weaponType || "";

        document.getElementById("weaponQuote").value =
            playerData.weaponQuote || "";


        // ==========================================
        // SOCIAL MEDIA
        // ==========================================

        document.getElementById("instagram").value =
            playerData.instagram || "";

        document.getElementById("youtube").value =
            playerData.youtube || "";

        document.getElementById("discord").value =
            playerData.discord || "";

        document.getElementById("facebook").value =
            playerData.facebook || "";


        // ==========================================
        // PLAYER IMAGE
        // ==========================================

        document.getElementById("previewImage").src =
            playerData.image || "../images/logo/logo.png";


        // ==========================================
        // WEAPON IMAGE
        // ==========================================

        if (playerData.weaponImage) {

            const weaponPreview =
                document.getElementById("weaponPreview");

            if (weaponPreview) {

                weaponPreview.src =
                    playerData.weaponImage;

                weaponPreview.style.display =
                    "block";

            }

        }


        document.body.style.visibility = "visible";


    } catch (error) {

        console.error(error);

        alert("Unable to load player profile.");

    }

});


// ==========================================
// PLAYER IMAGE PREVIEW
// ==========================================

document.getElementById("image").addEventListener(
    "change",
    function () {

        const file = this.files[0];

        if (!file) {
            return;
        }

        const reader = new FileReader();

        reader.onload = function (event) {

            document.getElementById("previewImage").src =
                event.target.result;

        };

        reader.readAsDataURL(file);

    }
);



// ==========================================
// 4FU ANDROID APP FCM - PROFILE UPDATES
// Android app tokens only. No browser push.
// ==========================================
const FOUR_FU_ANDROID_FCM_URL = "https://script.google.com/macros/s/AKfycbyazs42LLtr5ulUJDf1y2EuDRzUKrHwD_B1DzFE1q1BipaBooQMPit6T5dKJeAfMy4_/exec";

function send4FUProfileUpdateNotification({ title, body }) {
    try {
        fetch(FOUR_FU_ANDROID_FCM_URL, {
            method: "POST",
            mode: "no-cors",
            headers: {
                "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify({
                type: "profile",
                priority: "normal",
                title: title,
                body: body,
                link: "/player-dashboard.html",
                updateType: "profile",
                senderPlayerId: playerDocId || "",
                senderEmail:
                    auth.currentUser?.email || ""
            })
        }).catch(error => {
            console.warn("4FU ANDROID FCM PROFILE UPDATE ERROR:", error);
        });
    } catch (error) {
        console.warn("4FU ANDROID FCM PROFILE UPDATE ERROR:", error);
    }
}

// ==========================================
// SAVE PLAYER PROFILE
// ==========================================

document.getElementById("saveBtn").addEventListener(
    "click",
    async () => {

        if (!playerDocId) {

            alert("Player profile not loaded.");

            return;

        }


        const saveBtn =
            document.getElementById("saveBtn");

        const uploadStatus =
            document.getElementById("uploadStatus");

        const uploadProgress =
            document.getElementById("uploadProgress");


        try {

            saveBtn.disabled = true;

            saveBtn.innerHTML =
                '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';


            // ==========================================
            // IMAGE UPLOAD
            // ==========================================

            let imageUrl =
                playerData.image || "";

            const imageFile =
                document.getElementById("image").files[0];


            if (imageFile) {

                uploadProgress.style.display = "block";

                uploadStatus.style.display = "block";

                uploadStatus.textContent =
                    "Uploading player image...";


                const storageRef =
                    firebase.storage().ref(
                        "player-profiles/" +
                        playerDocId +
                        "/" +
                        Date.now() +
                        "_" +
                        imageFile.name
                    );


                const uploadTask =
                    storageRef.put(imageFile);


                await new Promise((resolve, reject) => {

                    uploadTask.on(

                        "state_changed",

                        (snapshot) => {

                            const progress =
                                (
                                    snapshot.bytesTransferred /
                                    snapshot.totalBytes
                                ) * 100;

                            uploadProgress.value =
                                progress;

                        },

                        (error) => {

                            reject(error);

                        },

                        async () => {

                            imageUrl =
                                await uploadTask.snapshot
                                    .ref
                                    .getDownloadURL();

                            resolve();

                        }

                    );

                });

            }


            // ==========================================
            // WEAPON IMAGE UPLOAD
            // ==========================================

            let weaponImageUrl =
                playerData.weaponImage || "";

            const weaponFile =
                document.getElementById("weaponImage").files[0];


            if (weaponFile) {

                uploadStatus.style.display = "block";

                uploadStatus.textContent =
                    "Uploading weapon image...";


                const weaponStorageRef =
                    firebase.storage().ref(
                        "player-weapons/" +
                        playerDocId +
                        "/" +
                        Date.now() +
                        "_" +
                        weaponFile.name
                    );


                const weaponUploadTask =
                    weaponStorageRef.put(weaponFile);


                await new Promise((resolve, reject) => {

                    weaponUploadTask.on(

                        "state_changed",

                        (snapshot) => {

                            const progress =
                                (
                                    snapshot.bytesTransferred /
                                    snapshot.totalBytes
                                ) * 100;

                            uploadProgress.value =
                                progress;

                        },

                        (error) => {

                            reject(error);

                        },

                        async () => {

                            weaponImageUrl =
                                await weaponUploadTask.snapshot
                                    .ref
                                    .getDownloadURL();

                            resolve();

                        }

                    );

                });

            }


            // ==========================================
            // FIREBASE AUTH
            // ==========================================

            const currentUser = auth.currentUser;

            if (!currentUser) {

                throw new Error(
                    "You are not logged in."
                );

            }


            const oldEmail =
                (currentUser.email || "")
                    .trim()
                    .toLowerCase();


            const enteredEmail =
                document.getElementById("loginEmail")
                    .value
                    .trim()
                    .toLowerCase();

            // Blank means: keep the existing email unchanged.
            const newEmail = enteredEmail || oldEmail;


            const currentPassword =
                document.getElementById("currentPassword")
                    .value
                    .trim();


            const newPassword =
                document.getElementById("newPassword")
                    .value
                    .trim();


            const confirmPassword =
                document.getElementById("confirmPassword")
                    .value
                    .trim();


            if (!newEmail) {

                throw new Error(
                    "Login email cannot be empty."
                );

            }


            const changingEmail =
                newEmail !== oldEmail;


            const changingPassword =
                newPassword !== "";


            // ==========================================
            // RE-AUTHENTICATION
            // ==========================================

            if (
                changingEmail ||
                changingPassword
            ) {

                if (!currentPassword) {

                    throw new Error(
                        "Enter your current password."
                    );

                }


                const credential =
                    firebase.auth.EmailAuthProvider
                        .credential(
                            oldEmail,
                            currentPassword
                        );


                await currentUser
                    .reauthenticateWithCredential(
                        credential
                    );

            }


            // ==========================================
            // PASSWORD CHANGE
            // ==========================================

            if (changingPassword) {

                if (newPassword.length < 6) {

                    throw new Error(
                        "New password must be at least 6 characters."
                    );

                }


                if (
                    newPassword !==
                    confirmPassword
                ) {

                    throw new Error(
                        "New password and confirm password do not match."
                    );

                }


                await currentUser
                    .updatePassword(newPassword);

            }






            // ==========================================
            // EMAIL CHANGE
            // ==========================================

            // ==========================================
            // EMAIL CHANGE
            // ==========================================

            if (changingEmail) {

                await currentUser.updateEmail(newEmail);

            }

            // ==========================================
            // UPDATE FIRESTORE
            // ==========================================

            await db
                .collection("players")
                .doc(playerDocId)
                .update({

                    name:
                        document
                            .getElementById("name")
                            .value
                            .trim(),

                    ign:
                        document
                            .getElementById("ign")
                            .value
                            .trim(),

                    uid:
                        document
                            .getElementById("uid")
                            .value
                            .trim(),

                    guild:
                        document
                            .getElementById("guild")
                            .value
                            .trim(),

                    // ROLE LOCK: players cannot change their role.
                    role: playerData.role || "",

                    language:
                        document
                            .getElementById("language")
                            .value
                            .trim(),

                    country:
                        document
                            .getElementById("country")
                            .value,

                    loginEmail: newEmail,


                    level:
                        Number(
                            document
                                .getElementById("level")
                                .value
                        ) || 0,


                    rank:
                        document
                            .getElementById("rank")
                            .value,


                    kd:
                        document
                            .getElementById("kd")
                            .value
                            .trim(),


                    headshot:
                        document
                            .getElementById("headshot")
                            .value
                            .trim(),


                    matches:
                        Number(
                            document
                                .getElementById("matches")
                                .value
                        ) || 0,


                    booyah:
                        Number(
                            document
                                .getElementById("booyah")
                                .value
                        ) || 0,


                    weaponName:
                        document
                            .getElementById("weaponName")
                            .value
                            .trim(),


                    weaponType:
                        document
                            .getElementById("weaponType")
                            .value
                            .trim(),


                    weaponQuote:
                        document
                            .getElementById("weaponQuote")
                            .value
                            .trim(),


                    weaponImage:
                        weaponImageUrl,


                    instagram:
                        document
                            .getElementById("instagram")
                            .value
                            .trim(),


                    youtube:
                        document
                            .getElementById("youtube")
                            .value
                            .trim(),


                    discord:
                        document
                            .getElementById("discord")
                            .value
                            .trim(),


                    facebook:
                        document
                            .getElementById("facebook")
                            .value
                            .trim(),


                    image:
                        imageUrl

                });


            // ==========================================
            // ANDROID APP PUSH - PROFILE UPDATE
            // ==========================================
            const profileChanged =
                (playerData.name || "") !==
                    document.getElementById("name").value.trim() ||
                (playerData.ign || "") !==
                    document.getElementById("ign").value.trim() ||
                (playerData.uid || "") !==
                    document.getElementById("uid").value.trim() ||
                (playerData.guild || "") !==
                    document.getElementById("guild").value.trim() ||
                (playerData.language || "") !==
                    document.getElementById("language").value.trim() ||
                (playerData.country || "") !==
                    document.getElementById("country").value ||
                String(playerData.level ?? "") !==
                    String(Number(document.getElementById("level").value) || 0) ||
                (playerData.rank || "") !==
                    document.getElementById("rank").value ||
                (playerData.kd || "") !==
                    document.getElementById("kd").value.trim() ||
                (playerData.headshot || "") !==
                    document.getElementById("headshot").value.trim() ||
                String(playerData.matches ?? "") !==
                    String(Number(document.getElementById("matches").value) || 0) ||
                String(playerData.booyah ?? "") !==
                    String(Number(document.getElementById("booyah").value) || 0) ||
                (playerData.weaponName || "") !==
                    document.getElementById("weaponName").value.trim() ||
                (playerData.weaponType || "") !==
                    document.getElementById("weaponType").value.trim() ||
                (playerData.weaponQuote || "") !==
                    document.getElementById("weaponQuote").value.trim() ||
                (playerData.instagram || "") !==
                    document.getElementById("instagram").value.trim() ||
                (playerData.youtube || "") !==
                    document.getElementById("youtube").value.trim() ||
                (playerData.discord || "") !==
                    document.getElementById("discord").value.trim() ||
                (playerData.facebook || "") !==
                    document.getElementById("facebook").value.trim() ||
                (playerData.loginEmail || oldEmail) !== newEmail ||
                (playerData.image || "") !== imageUrl ||
                (playerData.weaponImage || "") !== weaponImageUrl ||
                changingPassword;

            if (profileChanged) {
                const playerName =
                    document.getElementById("name").value.trim() ||
                    document.getElementById("ign").value.trim() ||
                    "A player";

                send4FUProfileUpdateNotification({
                    title: "📝 Player Profile Updated",
                    body:
                        playerName +
                        " updated their player profile."
                });
            }


            // ==========================================
            // SUCCESS
            // ==========================================

            uploadProgress.style.display =
                "none";

            uploadStatus.style.display =
                "block";

            uploadStatus.textContent =
                "Profile updated successfully!";


            saveBtn.innerHTML =
                '<i class="fa-solid fa-check"></i> Saved';


            setTimeout(() => {

                window.location.href =
                    "player-dashboard.html";

            }, 1200);


        } catch (error) {

            console.error(
                "SAVE ERROR:",
                error
            );

            alert(
    "Firebase Error:\n\n" +
    "CODE: " + (error.code || "NO CODE") +
    "\n\nMESSAGE: " + (error.message || "NO MESSAGE")
);


            uploadStatus.style.display =
                "block";


            let message =
                "Unable to save profile.";


            if (
                error.code ===
                "auth/wrong-password"
            ) {

                message =
                    "Current password is incorrect.";

            }

            else if (
                error.code ===
                "auth/invalid-credential"
            ) {

                message =
                    "Current password is incorrect.";

            }

            else if (
                error.code ===
                "auth/weak-password"
            ) {

                message =
                    "New password is too weak.";

            }

            else if (
                error.code ===
                "auth/email-already-in-use"
            ) {

                message =
                    "This email is already used by another account.";

            }

            else if (
                error.code ===
                "auth/invalid-email"
            ) {

                message =
                    "Please enter a valid email.";

            }

            else if (
                error.code ===
                "auth/requires-recent-login"
            ) {

                message =
                    "Please logout and login again, then try again.";

            }

            else if (
                error.code ===
                "auth/operation-not-allowed"
            ) {

                message =
                    "Firebase Authentication does not allow this operation.";

            }

            else if (
                error.code ===
                "permission-denied"
            ) {

                message =
                    "Permission denied. Check Firestore Rules.";

            }

            else if (error.message) {

                message =
                    error.message;

            }


            uploadStatus.textContent =
                message;


            saveBtn.disabled = false;


            saveBtn.innerHTML =
                '<i class="fa-solid fa-floppy-disk"></i> Save Changes';

        }

    }
);
    </script>
